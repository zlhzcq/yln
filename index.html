<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>完整背景图</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100vh;
        }
        body {
            /* 直接使用 img 标签确保图片加载，避免背景图跨域问题 */
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000;
            margin: 0;
        }
        img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <img src="https://pixiv.re/83110343-1.jpg" alt="背景图">
</body>
</html>
