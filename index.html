<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>背景图展示</title>
    <style>
        /* 重置默认边距，让页面占满视口 */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
        }
        body {
            /* 设置背景图 */
            background-image: url("https://pixiv.re/83110343-1.jpg");
            /* 让背景图覆盖整个区域，保持比例不变形 */
            background-size: cover;
            /* 让背景图居中显示 */
            background-position: center;
            /* 禁止背景图重复 */
            background-repeat: no-repeat;
        }
    </style>
</head>
<body>
</body>
</html>
