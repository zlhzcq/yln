  body {
            /* 设置背景图 */
            background-image: url("https://pixiv.re/83110343-1.jpg");
            /* 让背景图覆盖整个区域，保持比例不变形 */
            background-size: cover;
            /* 让背景图居中显示 */
            background-position: center;
            /* 禁止背景图重复 */
            background-repeat: no-repeat;
          }
